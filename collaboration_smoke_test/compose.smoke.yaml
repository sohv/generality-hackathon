services:
  default:
    image: python:3.12-slim@sha256:2c941e860699f878900b0edc2403613c234d4b32eda3cc9fa7036991a2a63c4a
    init: true
    command: tail -f /dev/null
    working_dir: /workspace
    network_mode: none
    cpus: 1.0
    mem_limit: 512m
    volumes:
      - ${TEAM_WORKSPACE_PATH:?Set TEAM_WORKSPACE_PATH}:/workspace
